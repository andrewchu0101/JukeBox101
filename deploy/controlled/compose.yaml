# REVIEW ONLY: not installed. Root must own this file, env file and every parent.
# No caller-supplied Compose paths or settings may be accepted by a future adapter.
name: jukebox101
services:
  bot:
    image: ${JB_IMAGE:?reviewed immutable digest required}
    labels:
      com.jukebox101.gateway.application: ${DISCORD_EXPECTED_APPLICATION_ID:?root-managed application required}
    user: '10001:10001'
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: [CMD, python, -m, bot.healthcheck]
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 1m
    environment:
      DB_HOST: ${DB_HOST:?root-managed database hostname required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?root-managed database name required}
      DB_USER: ${DB_USER:?root-managed application role required}
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/db_ca.crt
      DB_PASSWORD_FILE: /run/secrets/db_password
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      DISCORD_EXPECTED_APPLICATION_ID: ${DISCORD_EXPECTED_APPLICATION_ID:?root-managed application required}
      DISCORD_OWNER_USER_ID: ${DISCORD_OWNER_USER_ID:?root-managed owner required}
      DISCORD_OWNER_GUILD_ID: ${DISCORD_OWNER_GUILD_ID:-}
      SECRET_EXPECTED_UID: '10001'
      SECRET_EXPECTED_GID: '10001'
      JUKEBOX_FORMAL_EXCHANGE: 'off'
      JUKEBOX_NICKEL_CLAIM: 'off'
      # Automatic review: every mode starts closed and is opened only from the root-owned bot.env, never by this file.
      # JUKEBOX_AUTO_REVIEW=on needs JUKEBOX_API_RETENTION=on and the key file below; JUKEBOX_AUTO_VERSION_CONFIRM=on needs both.
      JUKEBOX_AUTO_REVIEW: ${JUKEBOX_AUTO_REVIEW:-off}
      JUKEBOX_API_RETENTION: ${JUKEBOX_API_RETENTION:-off}
      JUKEBOX_AUTO_SETTLEMENT: ${JUKEBOX_AUTO_SETTLEMENT:-off}
      JUKEBOX_AUTO_VERSION_CONFIRM: ${JUKEBOX_AUTO_VERSION_CONFIRM:-off}
      # allowlist (default) or music_category; the open mode needs review, retention and version confirmation all on or the Bot refuses to start.
      JUKEBOX_AUTO_TRUST_MODE: ${JUKEBOX_AUTO_TRUST_MODE:-allowlist}
      YOUTUBE_TRUSTED_CHANNEL_IDS: ${YOUTUBE_TRUSTED_CHANNEL_IDS:-}
      YOUTUBE_API_KEY_FILE: /run/secrets/youtube_api_key
    secrets: [discord_bot_token, db_password, db_ca.crt, youtube_api_key]
    networks: [egress, database]
secrets:
  discord_bot_token:
    file: /etc/jukebox101/secrets/discord_bot_token.txt
  db_password:
    file: /etc/jukebox101/secrets/db_password.txt
  db_ca.crt:
    file: ${JB_DB_CA_FILE:-/etc/jukebox101/supabase-ca-2021.crt}
  youtube_api_key:
    file: /etc/jukebox101/secrets/youtube_api_key.txt
networks:
  egress:
    external: true
    name: ${JB_EGRESS_NETWORK:-jukebox101_egress}
  database:
    external: true
    name: ${JB_DATABASE_NETWORK:-jukebox101_database}
