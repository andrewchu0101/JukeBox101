# Opt-in overlay for automatic review and settlement. It is not used unless named with -f, so the base stack is unchanged.
#   docker compose -f compose.yaml -f compose.auto-review.yaml up -d --no-build
# Requires ${JB_SECRET_DIR}/youtube_api_key.txt owned by uid/gid 10001 with mode 0400. See docs/deploy/auto-review-nickel-enable.md.
services:
  bot:
    environment:
      JUKEBOX_AUTO_REVIEW: ${JUKEBOX_AUTO_REVIEW:-off}
      JUKEBOX_AUTO_SETTLEMENT: ${JUKEBOX_AUTO_SETTLEMENT:-off}
      YOUTUBE_TRUSTED_CHANNEL_IDS: ${YOUTUBE_TRUSTED_CHANNEL_IDS:-}
      YOUTUBE_API_KEY_FILE: /run/secrets/youtube_api_key
    secrets:
      - youtube_api_key

secrets:
  youtube_api_key:
    file: ${JB_SECRET_DIR:?set JB_SECRET_DIR to the host directory holding the secret files}/youtube_api_key.txt
