name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: jukebox101-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build the development-only Python 3.12 test image
        run: docker build --pull -f test.Dockerfile -t jukebox101-test:v7-local .
      - name: Isolated CI/CD smoke with synthetic data and no database
        env:
          TEST_IMAGE: jukebox101-test:v7-local
        run: python3 -m scripts.ci.cd_smoke
      - name: Preserve isolated test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
