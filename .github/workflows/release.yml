name: Release

'on':
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    if: github.repository == 'andrewchu0101/JukeBox101'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      export_runtime: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/andrewchu0101/jukebox101
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-runtime
      - name: Load and tag the exact tested image without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(cat ci-runtime/image-id.txt)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker load --input ci-runtime/image.tar
          test "$(docker image inspect --format '{{.Id}}' "$image_id")" = "$image_id"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")" = "$GITHUB_SHA"
          docker tag "$image_id" "$IMAGE:$GITHUB_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image and bind its registry digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
          [[ "$reference" == "$IMAGE@"* ]]
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the immutable image using GitHub OIDC
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/andrewchu0101/jukebox101
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  deploy:
    # Kill switch: set repository variable CD_ENABLED=false to stop deploying without touching code.
    needs: publish
    if: vars.CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {}
    environment: production
    concurrency:
      group: jukebox101-production
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      RELEASE_RUN: ${{ github.run_id }}
      RELEASE_ATTEMPT: ${{ github.run_attempt }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Ask the host to switch to this exact image and wait for its answer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$RELEASE_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]] || { echo '::error::Repository variable DEPLOY_HOST is missing or invalid'; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo '::error::Environment secret DEPLOY_SSH_KEY is missing'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo '::error::Environment secret DEPLOY_KNOWN_HOSTS is missing'; exit 1; }
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/jukebox-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          remote=(ssh -T -p 22 -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
            "jukebox-deploy@$DEPLOY_HOST")
          # The same request is idempotent on the host, so a lost connection is answered by asking again.
          for attempt in {1..60}; do
            ssh_status=0
            status="$(printf 'deploy-v2 %s %s %s %s\n' "$COMMIT" "$DIGEST" "$RELEASE_RUN" "$RELEASE_ATTEMPT" |
              "${remote[@]}")" || ssh_status=$?
            # The host uses exit 2 for a refusal; ssh itself uses 255 for transport failures.
            if [[ "$ssh_status" == 255 ]]; then
              status=unreachable
            elif [[ "$ssh_status" != 0 && "$ssh_status:$status" != '2:rejected' ]]; then
              status=invalid
            fi
            case "$status" in
              succeeded) echo 'Deployment succeeded'; exit 0 ;;
              running|unreachable) echo "Host answer: $status; asking again in 10s"; sleep 10 ;;
              rolled_back) echo '::error::New image was unhealthy; the previous image was restored'; exit 1 ;;
              rollback_failed) echo '::error::Rollback failed; the host is locked until a maintainer checks it'; exit 1 ;;
              rejected) echo '::error::Host refused the request (stale run, bad image labels, locked, or bad host config)'; exit 1 ;;
              *) echo '::error::Unexpected host response'; exit 1 ;;
            esac
          done
          echo '::error::No final answer from the host; check the host before retrying.'
          exit 1
