name: Notify

'on':
  workflow_run:
    workflows: [CI, Release, Deploy]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.repository == 'andrewchu0101/JukeBox101'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: jukebox101-notify-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    steps:
      # Always use the trusted default-branch snapshot, never the triggering PR's code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish one result to the subscribed GitHub notification issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m deploy.github_notifications
