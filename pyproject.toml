[project]
name = "jukebox101"
version = "0.1.0"
description = "Local-first Discord music exchange foundation"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg>=3.3,<3.4", "python-dotenv>=1,<2", "discord.py>=2.4,<3", "aiohttp>=3.14,<4", "PyNaCl>=1.5,<2", "tzdata>=2026.6,<2027"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "postgres: opt-in integration tests against a disposable PostgreSQL test database (JB_PG_TEST_* settings)",
]
